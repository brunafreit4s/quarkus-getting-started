---
openapi: 3.1.0
paths:
  /hello:
    get:
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
      summary: Retorna uma mensagem de saudação
      tags:
      - Hello
  /produtos:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Produto"
      summary: Lista Produtos
      tags:
      - Produtos    
  /produtos/{id}:
    get:
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Produto"
        "400":
          description: Bad Request
        "404":
          description: Not Found
      summary: Consulta Produto
      tags:
      - Produtos
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProdutoDTO"
        required: true
      responses:
        "201":
          description: Produto cadastrado com sucesso
          content:
            application/json:
              schema: {}
        "400":
          description: Bad Request
        "404":
          description: Not Found
      summary: Cadastra Produto
      tags:
      - Produtos
    put:
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProdutoDTO"
        required: true
      responses:
        "200":
          description: Produto atualizado com sucesso
          content:
            application/json:
              schema: {}
        "400":
          description: Bad Request
        "404":
          description: Not Found
      summary: Atualiza Produto
      tags:
      - Produtos
    delete:
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "404":
          description: Not Found
      summary: Deleta Produto
      tags:
      - Produtos
info:
  title: quarkus-getting-started API
  version: 1.0.0
components:
  schemas:
    Date:
      type: string
      format: date
      examples:
      - 2022-03-10
    Produto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        descricao:
          type: string
        preco:
          type: number
        dataCriacao:
          $ref: "#/components/schemas/Date"
        dataAtualizacao:
          $ref: "#/components/schemas/Date"
    ProdutoDTO:
      type: object
      properties:
        nome:
          type: string
        descricao:
          type: string
        preco:
          type: number
