# Utilizar somente a especificação OpenAPI estática
mp.openapi.scan.disable=true

# Incluir Swagger UI também em produção
# quarkus.swagger-ui.always-include=true

# Configurações do banco de dados ----------------------------------------------------------
# URL de conexão com o banco de dados MySQL
quarkus.datasource.url=jdbc:mysql://localhost:3306/dbCRUDProdutos
# Configurar o driver JDBC para MySQL
quarkus.datasource.driver=com.mysql.cj.jdbc.Driver
# Usuário para conexão com o banco de dados
quarkus.datasource.username=root
# Senha para conexão com o banco de dados
quarkus.datasource.password=root123

# Configurações do Hibernate ---------------------------------------------------------------
# Atualizar o esquema do banco de dados automaticamente com base nas entidades
quarkus.hibernate-orm.database.generation=update
# Configurar o dialeto do Hibernate para MySQL 8
quarkus.hibernate-orm.dialect=org.hibernate.dialect.MySQL8Dialect